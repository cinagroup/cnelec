<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="china-electric.com 域名出售。查看报价、附赠商标信息，并通过腾讯云 WHOIS 表单联系购买。">
  <link rel="icon" type="image/png" href="/favicon.svg">
  <title>china-electric.com — 域名出售</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #192b35;
      --muted: #53636c;
      --line: #dce2e5;
      --accent: #183d50;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #fff;
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    button, a { -webkit-tap-highlight-color: transparent; }
    button { font: inherit; }
    .page { width: min(1080px, calc(100% - 96px)); margin: 0 auto; }
    .header {
      min-height: 108px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 24px;
      border-bottom: 1px solid var(--line);
    }
    .site-label { margin: 0; font-size: 14px; letter-spacing: .06em; }
    .languages { display: flex; gap: 24px; }
    .languages button {
      min-height: 44px;
      padding: 9px 0;
      color: var(--muted);
      background: transparent;
      border: 0;
      border-bottom: 1px solid transparent;
      cursor: pointer;
      font-size: 14px;
    }
    .languages button[aria-pressed="true"] { color: var(--ink); border-bottom-color: var(--ink); }
    .languages button:hover { color: var(--ink); }
    a:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 5px; }
    .overview {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 280px;
      gap: 64px;
      padding: 96px 0 88px;
    }
    h1 {
      margin: 0 0 26px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(36px, 4.7vw, 64px);
      font-weight: 400;
      line-height: 1.12;
      letter-spacing: -.045em;
      white-space: nowrap;
    }
    .summary { max-width: 490px; margin: 0; color: var(--muted); font-size: 17px; line-height: 1.9; }
    .purchase { padding-top: 5px; }
    .price-label { margin: 0 0 13px; font-size: 14px; color: var(--muted); }
    .price { margin: 0; font-size: 34px; font-weight: 500; line-height: 1.2; letter-spacing: -.035em; font-variant-numeric: tabular-nums; }
    .currency { display: block; margin-top: 8px; color: var(--muted); font-size: 12px; letter-spacing: .04em; }
    .contact-button {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 28px;
      min-height: 52px;
      margin-top: 30px;
      padding: 14px 22px;
      border-radius: 3px;
      background: var(--accent);
      color: #fff;
      text-decoration: none;
      font-size: 15px;
      line-height: 1.5;
      transition: background .15s ease;
    }
    .contact-button:hover { background: #27556c; }
    .contact-button svg { flex: 0 0 auto; width: 18px; height: 18px; }
    .contact-note { margin: 13px 0 0; font-size: 12px; line-height: 1.7; color: var(--muted); }
    .details {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 80px;
      padding: 39px 0 48px;
      border-top: 1px solid var(--line);
    }
    h2 { margin: 0 0 16px; font-size: 15px; font-weight: 600; line-height: 1.6; }
    .details p { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.95; }
    .details .trademark { color: var(--ink); margin-bottom: 7px; font-size: 17px; }
    .registration { margin: 0; display: flex; flex-wrap: wrap; column-gap: 25px; row-gap: 6px; color: var(--muted); font-size: 13px; line-height: 1.9; }
    .registration div { display: flex; gap: 8px; }
    .registration dt, .registration dd { margin: 0; }
    .registration dd { color: var(--ink); }
    .footer { border-top: 1px solid var(--line); padding: 23px 0 32px; color: var(--muted); font-size: 12px; line-height: 1.8; }
    .footer p { margin: 0; }
    @media (max-width: 1000px) {
      .page { width: calc(100% - 64px); }
      .overview { grid-template-columns: minmax(0, 1fr) 248px; gap: 36px; padding: 76px 0 64px; }
      h1 { font-size: clamp(32px, 4.4vw, 44px); }
      .details { gap: 48px; }
    }
    @media (max-width: 760px) {
      .page { width: calc(100% - 40px); }
      .header { min-height: 80px; gap: 16px; }
      .languages { gap: 20px; }
      .site-label { font-size: 13px; }
      .overview { grid-template-columns: 1fr; gap: 37px; padding: 51px 0 42px; }
      h1 { margin-bottom: 19px; font-size: clamp(27px, 7.5vw, 48px); }
      .summary { font-size: 15px; line-height: 1.85; }
      .purchase { padding: 0; }
      .price { font-size: 32px; }
      .price-label { margin-bottom: 10px; }
      .contact-button { margin-top: 24px; }
      .details { grid-template-columns: 1fr; gap: 30px; padding: 30px 0 35px; }
      h2 { margin-bottom: 11px; }
    }
    @media (prefers-reduced-motion: reduce) { .contact-button { transition: none; } }
  </style>
</head>
<body>
  <div class="page">
    <header class="header">
      <p class="site-label" data-zh="域名出售" data-en="Domain for sale">域名出售</p>
      <nav class="languages" aria-label="语言 / Language">
        <button type="button" lang="zh-CN" data-language="zh" aria-pressed="true">中文</button>
        <button type="button" lang="en" data-language="en" aria-pressed="false">English</button>
      </nav>
    </header>

    <main>
      <section class="overview" aria-labelledby="domain-name">
        <div>
          <h1 id="domain-name">china-electric.com</h1>
          <p class="summary" data-zh="此域名正在出售，可用于电气、能源及相关业务的网站。" data-en="A domain for an electrical or energy business.">此域名正在出售，可用于电气、能源及相关业务的网站。</p>
        </div>
        <div class="purchase">
          <p class="price-label" data-zh="出售报价" data-en="Asking price">出售报价</p>
          <p class="price" data-zh="¥8,888,888" data-en="$1,250,000">¥8,888,888</p>
          <span class="currency" data-zh="人民币 · CNY" data-en="US dollars · USD">人民币 · CNY</span>
          <a class="contact-button" href="https://whois.cloud.tencent.com/whoisform?domain=china-electric.com">
            <span data-zh="咨询购买" data-en="Inquire about purchase">咨询购买</span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
          </a>
          <p class="contact-note" data-zh="通过腾讯云 WHOIS 表单联系域名持有人。" data-en="Contact the domain holder via Tencent Cloud WHOIS.">通过腾讯云 WHOIS 表单联系域名持有人。</p>
        </div>
      </section>

      <section class="details" aria-label="出售说明" data-aria-zh="出售说明" data-aria-en="Sale details">
        <div>
          <h2 data-zh="域名信息" data-en="About the domain">域名信息</h2>
          <p data-zh="由 China 与 electric 组成，以连字符连接，后缀为 .com。可用于电气设备企业官网、能源项目网站，或面向海外客户的业务展示。" data-en="China and electric, joined by a hyphen, with a .com extension. Suitable for an electrical equipment business, an energy project, or a website for international customers.">由 China 与 electric 组成，以连字符连接，后缀为 .com。可用于电气设备企业官网、能源项目网站，或面向海外客户的业务展示。</p>
        </div>
        <div>
          <h2 data-zh="附赠商标" data-en="Included trademark">附赠商标</h2>
          <p class="trademark" data-zh="“海内”商标" data-en="“海内” trademark">“海内”商标</p>
          <dl class="registration">
            <div><dt data-zh="国际分类" data-en="International Class">国际分类</dt><dd>07</dd></div>
            <div><dt data-zh="注册号" data-en="Registration No.">注册号</dt><dd>49114242</dd></div>
          </dl>
        </div>
      </section>
    </main>

    <footer class="footer">
      <p data-zh="如有购买意向，请通过上方入口咨询域名及商标转让事宜。" data-en="For purchase enquiries, use the contact link above to discuss the domain and trademark transfer.">如有购买意向，请通过上方入口咨询域名及商标转让事宜。</p>
    </footer>
  </div>

  <script>
    (() => {
      const buttons = document.querySelectorAll('[data-language]');
      const description = document.querySelector('meta[name="description"]');
      const descriptions = {
        zh: 'china-electric.com 域名出售。查看报价、附赠商标信息，并通过腾讯云 WHOIS 表单联系购买。',
        en: 'china-electric.com is for sale. View the asking price and included trademark, and enquire via Tencent Cloud WHOIS.'
      };

      function switchLanguage(language) {
        document.documentElement.lang = language === 'zh' ? 'zh-CN' : 'en';
        document.title = language === 'zh' ? 'china-electric.com — 域名出售' : 'china-electric.com — Domain for sale';
        description.content = descriptions[language];
        document.querySelectorAll('[data-zh][data-en]').forEach(element => {
          element.textContent = element.dataset[language];
        });
        document.querySelectorAll('[data-aria-zh][data-aria-en]').forEach(element => {
          element.setAttribute('aria-label', element.getAttribute('data-aria-' + language));
        });
        buttons.forEach(button => {
          button.setAttribute('aria-pressed', String(button.dataset.language === language));
        });
      }

      buttons.forEach(button => {
        button.addEventListener('click', () => switchLanguage(button.dataset.language));
      });
    })();
  </script>
</body>
</html>
